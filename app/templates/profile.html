{% extends "authenticated-base.html" %}
{% block page_title %}My Profile | StudentCare{% endblock %}

{% block subpage_content %}
<section class="profile-panel card p-4 p-md-5">
  <p class="landing-kicker text-uppercase mb-1">Account</p>
  <h1 class="h2 mb-4">My Profile</h1>
  <dl class="row mb-0">
    <dt class="col-sm-3">Username</dt>
    <dd class="col-sm-9">{{ user.username }}</dd>
    <dt class="col-sm-3">Email</dt>
    <dd class="col-sm-9">{{ user.email }}</dd>
  </dl>
</section>
{% endblock %}
